name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Docker image, with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build -f Dockerfile.test -t voice-assistant-manager-test .
      - name: Run the full suite
        # The image has ffmpeg, which the avatar stream tests run for real.
        run: >
          docker run --rm -v "$PWD:/src" voice-assistant-manager-test
          python -m pytest -p no:cacheprovider --cov --cov-report=term

  checks:
    name: Lint, types and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install the development tools
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Audit the pinned dependencies
        run: pip-audit -r requirements-test.txt
