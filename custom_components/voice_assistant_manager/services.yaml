compose_announcement:
  fields:
    satellite:
      required: true
      example: assist_satellite.kitchen_satellite
      selector:
        entity:
          domain: assist_satellite
    kind:
      required: true
      default: reminder
      selector:
        select:
          options:
            - reminder
    text:
      required: true
      example: Call the plumber about the boiler at 5 pm
      selector:
        text:
          multiline: true
    recipient:
      required: true
      example: household
      selector:
        text:
    assistant:
      required: false
      example: jeeves
      selector:
        text:

prepare_announcement:
  fields:
    satellite:
      required: true
      example: assist_satellite.kitchen_satellite
      selector:
        entity:
          domain: assist_satellite
    assistant:
      required: false
      example: jeeves
      selector:
        text:

start_chat:
  fields:
    a:
      required: true
      example: 0123456789abcdef0123456789abcdef
      selector:
        config_entry:
          integration: voice_assistant_manager
    b:
      required: true
      example: fedcba9876543210fedcba9876543210
      selector:
        config_entry:
          integration: voice_assistant_manager
    speaker:
      required: true
      example: assist_satellite.kitchen_satellite
      selector:
        entity:
          filter:
            - domain: assist_satellite
            - domain: media_player
    topic:
      required: false
      example: Is a hot dog a sandwich?
      selector:
        text:
    max_lines:
      required: false
      selector:
        number:
          min: 2
          max: 50
    words:
      required: false
      selector:
        number:
          min: 5
          max: 80
    pause:
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
    minutes:
      required: false
      selector:
        number:
          min: 1
          max: 30
    listen:
      required: false
      selector:
        boolean:

stop_chat:

create_reminder_event:
  fields:
    calendar:
      required: true
      example: calendar.alex_reminders_announce
      selector:
        entity:
          domain: calendar
    summary:
      required: true
      example: Take the pills
      selector:
        text:
    description:
      required: false
      example: "assistant: jeeves"
      selector:
        text:
    start:
      required: true
      example: "2026-11-30T08:00:00+01:00"
      selector:
        datetime:
    duration_minutes:
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 1440
    repeat:
      required: true
      example: weekdays
      selector:
        select:
          options: [daily, weekdays, weekends, weekly, monthly, yearly]
    every:
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 99
    on_days:
      required: false
      example: monday, thursday
      selector:
        text:
    times:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 999
    until:
      required: false
      example: "12-31"
      selector:
        text:

cancel_reminder_event:
  fields:
    calendar:
      required: true
      example: calendar.alex_reminders_announce
      selector:
        entity:
          domain: calendar
          multiple: true
    title:
      required: true
      example: pills
      selector:
        text:

list_reminder_events:
  fields:
    reminders:
      required: true
      example: '[{"for_whom": "alex", "calendar": "calendar.alex_reminders", "spoken": false}]'
      selector:
        object:
    keywords:
      required: false
      example: car
      selector:
        text:
    on_day:
      required: false
      example: wednesday
      selector:
        text:
    until_day:
      required: false
      example: sunday
      selector:
        text:
