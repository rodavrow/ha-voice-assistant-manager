[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# respx comes with the Home Assistant test harness and is not used here. Its pytest plugin
# imports httpx; when pytest happens to load it before the harness (the order follows the
# file system and changes from one image build to the next), Home Assistant refuses to start
# with "httpx was already imported", and the run fails before a single test.
addopts = -p no:respx
